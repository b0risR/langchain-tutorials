name: Update commit counters

on:
  push:
    branches:
      - "**"
  delete:
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      (github.event_name != 'delete' || github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch all branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Update commit counts in README
        run: |
          python3 - <<'EOF'
          import re
          import subprocess


          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()


          branches = [
              b.removeprefix("origin/")
              for b in git(
                  "for-each-ref", "refs/remotes/origin", "--format=%(refname:short)"
              ).splitlines()
              if b not in ("origin", "origin/HEAD")
          ]
          branches.sort(key=lambda b: (b != "main", b))

          rows = "".join(
              f"| `{b}` | {git('rev-list', '--count', 'origin/' + b)} |\n"
              for b in branches
          )
          block = (
              "<!-- COMMIT-COUNTS:START -->\n"
              "| Branch | Commits |\n"
              "|---|---|\n"
              f"{rows}"
              "<!-- COMMIT-COUNTS:END -->"
          )

          with open("README.md") as f:
              content = f.read()

          content = re.sub(
              r"<!-- COMMIT-COUNTS:START -->.*?<!-- COMMIT-COUNTS:END -->",
              lambda _: block,
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(content)
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update commit counters [skip ci]"
          git push origin HEAD:main
